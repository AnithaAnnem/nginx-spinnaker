#   ports:
#     - name: http
#       port: ${SERVICE_PORT}
#       targetPort: http
#       protocol: TCP
apiVersion: v1
kind: Service
metadata:
  name: ${execution.variables.APP_NAME}
  namespace: ${execution.variables.NAMESPACE}
spec:
  type: ${execution.variables.SERVICE_TYPE}
  selector:
    app: ${execution.variables.APP_NAME}
  ports:
  - name: http
    port: ${#toInt(execution.variables.SERVICE_PORT)}
    targetPort: http

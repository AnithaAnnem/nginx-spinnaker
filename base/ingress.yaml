apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${execution.variables.APP_NAME}-ingress
  namespace: ${execution.variables.NAMESPACE}
spec:
  ingressClassName: nginx
  rules:
  - host: ${execution.variables.HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${execution.variables.APP_NAME}
            port:
              number: ${#toInt(execution.variables.SERVICE_PORT)}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${parameters.APP_NAME}-ingress
  namespace: ${parameters.NAMESPACE}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: ${parameters.HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${parameters.APP_NAME}
            port:
              number: ${parameters.SERVICE_PORT}                

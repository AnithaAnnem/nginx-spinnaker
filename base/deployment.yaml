apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${execution.variables.APP_NAME}
  labels:
    app: ${execution.variables.APP_NAME}
spec:
  replicas: ${#toInt(execution.variables.REPLICAS_DEV)}
  selector:
    matchLabels:
      app: ${execution.variables.APP_NAME}
  template:
    metadata:
      labels:
        app: ${execution.variables.APP_NAME}
    spec:
      containers:
      - name: ${execution.variables.APP_NAME}
        image: ${execution.variables.IMAGE}:${execution.variables.TAG}
        ports:
        - containerPort: ${#toInt(execution.variables.PORT)}
        resources:
          requests:
            cpu: ${execution.variables.CPU_REQUEST}
            memory: ${execution.variables.MEMORY_REQUEST}
          limits:
            cpu: ${execution.variables.CPU_LIMIT}
            memory: ${execution.variables.MEMORY_LIMIT}


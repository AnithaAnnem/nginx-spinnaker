apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${parameters.APP_NAME}
  labels:
    app: ${parameters.APP_NAME}
spec:
  replicas: ${parameters.REPLICAS}
  selector:
    matchLabels:
      app: ${parameters.APP_NAME}
  template:
    metadata:
      labels:
        app: ${parameters.APP_NAME}
    spec:
      containers:
        - name: ${parameters.APP_NAME}
          image: ${parameters.IMAGE}:${parameters.TAG}
          ports:
            - name: http
              containerPort: ${parameters.PORT}
          resources:
            requests:
              cpu: ${parameters.CPU_REQUEST}
              memory: ${parameters.MEMORY_REQUEST}
            limits:
              cpu: ${parameters.CPU_LIMIT}
              memory: ${parameters.MEMORY_LIMIT}
          readinessProbe:
            httpGet:
              path: ${parameters.READINESS_PATH}
              port: ${parameters.PORT}
          livenessProbe:
            httpGet:
              path: ${parameters.LIVENESS_PATH}
              port: ${parameters.PORT}
